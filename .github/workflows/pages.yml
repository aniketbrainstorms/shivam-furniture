name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Preview (sample products) until the repository variable LIVE is set to 'true'; then the real catalogue is built.
      - run: node build/build.js ${{ vars.LIVE == 'true' && ' ' || '--demo' }}
        env:
          SITE_URL: https://www.shivamfurniturestore.in
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # private; used only by the live build, never in the repo
          # the next two are public values (safe in the browser); access is protected by login and row-level security
          SUPABASE_URL: https://zsdnlwjctwtehmxqefbk.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZG5sd2pjdHd0ZWhteHFlZmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzg1ODIsImV4cCI6MjEwNzcxNDU4Mn0.i7ZCj2V7gN0Puz6dGNLBH-15xWPZAMuBsbl251VzJ6A
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
